name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Linux: its cctools/ld64-port linker still supports 32-bit armv7 (Apple's
    # toolchain dropped it), and there's no macOS runner queue.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync perl git curl unzip xz-utils zstd

      - name: Install Theos (+ Linux toolchain & SDKs)
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          # Official installer: fetches the swift/cctools toolchain and SDKs for Linux.
          export THEOS_NO_PROMPT=1
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "=== toolchain ==="; ls "$THEOS/toolchain" || true
          echo "=== SDKs after install ==="; ls "$THEOS/sdks" || true

      - name: Add armv7-capable iPhoneOS SDK (<= 10.x for iOS 6 target)
        run: |
          git clone https://github.com/theos/sdks.git --depth 1 /tmp/sdks
          echo "=== SDKs available in theos/sdks ==="; ls /tmp/sdks
          # Remove whatever (newer, arm64-only) SDKs the installer left, so that
          # Theos's "latest" resolves to the armv7-capable SDK we add below.
          rm -rf "$THEOS/sdks"/*.sdk
          PICKED=""
          for v in 6.1 7.1 8.1 8.4 9.0 9.2 9.3 10.0 10.1 10.2 10.3; do
            if [ -d "/tmp/sdks/iPhoneOS$v.sdk" ]; then
              cp -r "/tmp/sdks/iPhoneOS$v.sdk" "$THEOS/sdks/"
              PICKED="$v"; break
            fi
          done
          if [ -z "$PICKED" ]; then
            echo "::error::No armv7-capable iPhoneOS SDK (<=10.3) found in theos/sdks"; exit 1
          fi
          echo "Using iPhoneOS$PICKED.sdk"
          echo "=== SDKs now in THEOS ==="; ls "$THEOS/sdks"

          # iOS 8+ SDKs still reexport /usr/lib/system/liblaunch.dylib from
          # libSystem, but the file was removed (folded into libxpc), so the
          # armv7 link fails with "liblaunch.dylib not found". We use none of
          # its symbols, so drop in an empty stub .tbd to satisfy the reexport.
          SDKDIR="$THEOS/sdks/iPhoneOS$PICKED.sdk"
          if [ ! -e "$SDKDIR/usr/lib/system/liblaunch.tbd" ] && [ ! -e "$SDKDIR/usr/lib/system/liblaunch.dylib" ]; then
            cp "$GITHUB_WORKSPACE/ci/liblaunch.tbd" "$SDKDIR/usr/lib/system/liblaunch.tbd"
            echo "Installed stub liblaunch.tbd"
          fi

      - name: Build
        run: make clean all

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          for f in rootful/packages/*.deb; do
            [ -e "$f" ] && cp "$f" artifacts/
          done
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsReconnectFix
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
