name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $THEOS --depth 1
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p "$THEOS/sdks"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VER}.sdk"
          echo "SDK setup complete: iPhoneOS${SDK_VER}.sdk"

      - name: Build all variants
        run: make clean all

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # rootless and rootful build to identical filenames, so tag each by scheme.
          for f in rootless/packages/*.deb; do
            [ -e "$f" ] && cp "$f" "artifacts/$(basename "${f%.deb}")_rootless.deb"
          done
          for f in rootful/packages/*.deb; do
            [ -e "$f" ] && cp "$f" "artifacts/$(basename "${f%.deb}")_rootful.deb"
          done
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsReconnectFix-all
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
